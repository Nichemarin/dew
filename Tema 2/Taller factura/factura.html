<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="container">
        <h1>Sistema de Facturación</h1>
        <hr>

        <div>
            <h3>Añadir Producto</h3>
            <hr>
        </div>

        <div id="formulario">
            <form id="form-producto">
                <p>
                    <label for="descripcion">Concepto:</label>
                    <input type="text" id="descripcion" name="descripcion" required>
                </p>

                <p>
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" step="1" required>
                </p>

                <p>
                    <label for="precio">Precio (€):</label>
                    <input type="number" id="precio" name="precio" min="0" step="0.01" required>
                </p>

                <button type="submit" id="insertar">Insertar</button>
            </form>

            <h3>Seleccionar impuestos</h3>
            <hr>
        </div>

        <form id="taxes">
            <input type="radio" id="5percent" name="impuesto" value="5" checked>
            <label for="5percent">5%</label>

            <input type="radio" id="10percent" name="impuesto" value="10">
            <label for="10percent">10%</label>

            <input type="radio" id="15percent" name="impuesto" value="15">
            <label for="15percent">15%</label>

            <input type="radio" id="20percent" name="impuesto" value="20">
            <label for="20percent">20%</label>
        </form>

        <h3>Factura</h3>
        <hr>

        <div id="tabla">
            <table border="1">
                <thead>
                    <tr>
                        <th class="azul">Concepto</th>
                        <th class="azul">Cantidad</th>
                        <th class="azul">Precio Unit.</th>
                        <th class="azul">Precio total</th>
                        <th class="azul">Eliminar</th>
                    </tr>
                </thead>

                <tbody id="productos">
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">Subtotal: </td>
                        <td colspan="2"><span id="subtotal">0.00€</span></td>
                    </tr>
                    <tr>
                        <td colspan="3">Tasa: </td>
                        <td colspan="2"><span id="tasa">5%</span></td>
                    </tr>
                    <tr>
                        <td colspan="3">Impuestos: </td>
                        <td colspan="2"><span id="impuestos">0.00€</span></td>
                    </tr>
                    <tr id="finalTotal">
                        <td colspan="3"><strong>TOTAL: </strong></td>
                        <td colspan="2"><strong><span id="total">0.00€</span></strong></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</body>

</html>
