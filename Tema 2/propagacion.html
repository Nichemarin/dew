<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Propagación</h1>
    <section>
        <h1>Section</h1>
        <article>
            <h2>Article</h2>
            <div>
                <h3>div</h3>
                <button>Button</button>
            </div>
        </article>
    </section>
    <script>
        document.querySelector("section").addEventListener("click", (event) => console.log("Acción del section"));
        document.querySelector("article").addEventListener("click", (event) => console.log("Acción del article"), true);
        document.querySelector("div").addEventListener("click", (event) => console.log("Acción del div"));
        document.querySelector("button").addEventListener("click", (event) => {
            console.log("Acción del button");
            event.stopPropagation();
        });
    </script>
</body>

</html>
